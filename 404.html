<!DOCTYPE html>
<!--
==============================================================================
STATIC HOSTING FALLBACK — 404.html
==============================================================================

A static host can serve this page when a requested path does not exist. It is
self-contained: the small CSS block is embedded so the error page still works
even if another asset path is broken. The return link points back to index.html.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Quentin</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #070a12;
      color: #f7f9ff;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(520px, calc(100% - 40px));
      padding: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(18,27,49,.75);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); }
    p { color: #aeb9d2; }
    a {
      margin-top: 15px;
      padding: 12px 18px;
      display: inline-block;
      border-radius: 12px;
      background: linear-gradient(135deg, #3d7cff, #9a6cff);
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <a href="./index.html">Return to Quentin's portfolio</a>
  </main>
</body>
</html>
